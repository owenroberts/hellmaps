<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" type="text/css" href="style.css">
	<meta charset="utf-8">
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="ui">
		
		<label for="cell-width">Cell width</label>
		<input id="cell-width" type="number" min="4" max="128" value="16">
		<br>
		<label for="cell-height">Cell height</label>
		<input id="cell-height" type="number" min="4" max="128" value="16">
		<br>
		<label for="map-cols">Map columns</label>
		<input id="map-cols" type="number" min="2" max="32" value="32">
		<br>
		<label for="map-rows">Map rows</label>
		<input id="map-rows" type="number" min="2" max="32" value="32">
		<br>
		
		<label for="map-buffer-cols">Map buffer columns</label>
		<input id="map-buffer-cols" type="number" min="0" max="8" value="0">
		<br>

		<label for="map-buffer-rows">Map buffer rows</label>
		<input id="map-buffer-rows" type="number" min="0" max="8" value="0">
		<br>

		<label for="room-buffer-cols">Room buffer columns</label>
		<input id="room-buffer-cols" type="number" min="0" max="8" value="0">
		<br>

		<label for="room-buffer-rows">Room buffer rows</label>
		<input id="room-buffer-rows" type="number" min="0" max="8" value="0">
		<br>
		


		<label for="max-nodes">Max nodes</label>
		<input id="max-nodes" type="number" min="1" max="32" value="16">
		<br>
		<label for="use-paths">Use paths</label>
		<input id="use-paths" type="checkbox" checked>
		<br>

		<button id="new-map">generate</button>
	</div>
	<script src="src/index.js" type="module"></script>	
</body>
</html>
